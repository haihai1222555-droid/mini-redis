<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="키 1,000개를 처리하는 시간"><title>키 1,000개를 처리하는 시간</title><desc>읽기는 하나씩 76ms, mget 2.3ms. 쓰기는 하나씩 111ms, mset 2.2ms</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="418" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">키 1,000개를 처리하는 시간 (ms · 짧을수록 좋음)</text><rect x="560" y="62" width="14" height="14" rx="3" fill="#eb6834" stroke="none" stroke-width="0"/><text x="582" y="75" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">하나씩 요청</text><rect x="690" y="62" width="14" height="14" rx="3" fill="#2a78d6" stroke="none" stroke-width="0"/><text x="712" y="75" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">배치 한 번</text><line x1="230.0" y1="96" x2="230.0" y2="340" stroke="#c3c2b7" stroke-width="1.5"/><text x="230.0" y="362" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">0</text><line x1="392.5" y1="96" x2="392.5" y2="340" stroke="#e1e0d9" stroke-width="1.5"/><text x="392.5" y="362" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">30</text><line x1="555.0" y1="96" x2="555.0" y2="340" stroke="#e1e0d9" stroke-width="1.5"/><text x="555.0" y="362" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">60</text><line x1="717.5" y1="96" x2="717.5" y2="340" stroke="#e1e0d9" stroke-width="1.5"/><text x="717.5" y="362" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">90</text><line x1="880.0" y1="96" x2="880.0" y2="340" stroke="#e1e0d9" stroke-width="1.5"/><text x="880.0" y="362" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">120</text><text x="884" y="380" font-size="13" fill="#52514e" font-weight="400" text-anchor="end">ms</text><text x="28" y="156" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">읽기 1,000개</text><text x="28" y="178" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">GET 하나씩 ↔ POST /mget</text><path d="M230,112 h407.6666666666667 a4,4 0 0 1 4,4 v30 a4,4 0 0 1 -4,4 h-407.6666666666667 z" fill="#eb6834"/><text x="651.6666666666667" y="137" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">76 ms</text><path d="M230,158 h8.458333333333334 a4,4 0 0 1 4,4 v30 a4,4 0 0 1 -4,4 h-8.458333333333334 z" fill="#2a78d6"/><text x="252.45833333333334" y="184" font-size="16" fill="#184f95" font-weight="700" text-anchor="start">2.3 ms  ·  약 33배 빠름</text><text x="28" y="276" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">쓰기 1,000개</text><text x="28" y="298" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">PUT 하나씩 ↔ POST /mset</text><path d="M230,232 h597.25 a4,4 0 0 1 4,4 v30 a4,4 0 0 1 -4,4 h-597.25 z" fill="#eb6834"/><text x="841.25" y="257" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">111 ms</text><path d="M230,278 h7.916666666666668 a4,4 0 0 1 4,4 v30 a4,4 0 0 1 -4,4 h-7.916666666666668 z" fill="#2a78d6"/><text x="251.91666666666666" y="304" font-size="16" fill="#184f95" font-weight="700" text-anchor="start">2.2 ms  ·  약 50배 빠름</text><text x="28" y="404" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">※ 같은 PC · keep-alive HTTP 기준. 서버가 원격이면 요청마다 왕복 지연이 붙