<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="LRU 구조: 해시 테이블과 이중 연결 리스트"><title>LRU 구조: 해시 테이블과 이중 연결 리스트</title><desc>해시 테이블은 키로 노드를 O(1)에 찾고, 이중 연결 리스트는 사용 순서를 맨 앞부터 맨 뒤까지 유지한다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="378" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">해시 테이블은 '찾기', 연결 리스트는 '순서'를 맡는다</text><text x="28" y="120" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="start">이중 연결 리스트</text><text x="28" y="144" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">사용 순서 · 갱신/제거 O(1)</text><text x="370" y="92" font-size="14" fill="#184f95" font-weight="600" text-anchor="middle">head · 가장 최근</text><text x="770" y="92" font-size="14" fill="#a63f16" font-weight="600" text-anchor="middle">tail · 가장 오래됨</text><rect x="300" y="104" width="140" height="60" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2.5"/><text x="370" y="142" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="middle">key: c</text><line x1="442" y1="124" x2="498" y2="124" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><line x1="498" y1="148" x2="442" y2="148" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><rect x="500" y="104" width="140" height="60" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="2.5"/><text x="570" y="142" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="middle">key: b</text><line x1="642" y1="124" x2="698" y2="124" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><line x1="698" y1="148" x2="642" y2="148" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><rect x="700" y="104" width="140" height="60" rx="10" fill="#fdeae1" stroke="#eb6834" stroke-width="2.5"/><text x="770" y="142" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="middle">key: a</text><text x="848" y="130" font-size="13" fill="#a63f16" font-weight="700" text-anchor="start">← 가득 차면</text><text x="848" y="148" font-size="13" fill="#a63f16" font-weight="700" text-anchor="start">여기를 버린다</text><text x="28" y="288" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="start">해시 테이블</text><text x="28" y="312" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">키로 찾기 O(1)</text><rect x="300" y="262" width="140" height="52" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="370" y="285" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="middle">c</text><text x="370" y="304" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">노드 위치를 저장</text><line x1="370" y1="260" x2="370" y2="168" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#ah-blue)"/><rect x="500" y="262" width="140" height="52" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="570" y="285" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="middle">b</text><text x="570" y="304" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">노드 위치를 저장</text><line x1="570" y1="260" x2="570" y2="168" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#ah-blue)"/><rect x="700" y="262" width="140" height="52" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="770" y="285" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="middle">a</text><text x="770" y="304" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">노드 위치를 저장</text><line x1="770" y1="260" x2="770" y2="168" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#ah-blue)"/><text x="578" y="222" font-size="14" fill="#184f95" font-weight="600" text-anchor="start">노드를 직접 가리킨다</text><text x="28" y="358" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">→ 키로 노드를 찾고(O(1)), 찾은 노드를 리스트에서 떼어 맨 앞으로 옮기는 것(O(1))까지 훑지 않고 끝난다.</text></svg>