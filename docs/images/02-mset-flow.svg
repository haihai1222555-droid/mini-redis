<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="mset: 전부 검증, 공간 확인, 한 번에 반영"><title>mset: 전부 검증, 공간 확인, 한 번에 반영</title><desc>mset은 모든 항목을 검증하고 공간을 확인한 뒤 한 번에 반영하며, 하나라도 문제면 아무것도 저장하지 않는다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="288" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">mset — 전부 저장되거나, 전부 거부된다</text><rect x="24" y="70" width="140" height="84" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="2"/><text x="94.0" y="108.2" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">요청</text><text x="94.0" y="128.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">항목 N개</text><rect x="214" y="70" width="180" height="84" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="304.0" y="108.8" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">① 전부 검증</text><text x="304.0" y="128.4" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">key · value · ttl 형식</text><rect x="444" y="70" width="180" height="84" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="534.0" y="108.8" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">② 공간 확인</text><text x="534.0" y="128.4" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">새 키가 들어갈 자리</text><rect x="674" y="70" width="180" height="84" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2"/><text x="764.0" y="108.8" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">③ 한 번에 반영</text><text x="764.0" y="128.4" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">동기 실행 · AOF 한 줄</text><rect x="884" y="70" width="52" height="84" rx="10" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><text x="910.0" y="117.9" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">✓</text><line x1="164" y1="112.0" x2="212" y2="112.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah-ink)"/><line x1="394" y1="112.0" x2="442" y2="112.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah-ink)"/><line x1="624" y1="112.0" x2="672" y2="112.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah-ink)"/><line x1="854" y1="112.0" x2="882" y2="112.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah-ink)"/><text x="910" y="176" font-size="13" fill="#184f95" font-weight="700" text-anchor="middle">전부 저장</text><line x1="304" y1="154" x2="304" y2="200" stroke="#eb6834" stroke-width="2.2" marker-end="url(#ah-orange)"/><text x="314" y="187" font-size="13" fill="#a63f16" font-weight="600" text-anchor="start">잘못된 항목</text><line x1="534" y1="154" x2="534" y2="200" stroke="#eb6834" stroke-width="2.2" marker-end="url(#ah-orange)"/><text x="544" y="187" font-size="13" fill="#a63f16" font-weight="600" text-anchor="start">자리 부족</text><rect x="204" y="202" width="440" height="62" rx="10" fill="#fdeae1" stroke="#eb6834" stroke-width="2"/><text x="424.0" y="229.5" font-size="16" fill="#a63f16" font-weight="700" text-anchor="middle">✗ 하나라도 문제면 아무것도 저장하지 않는다</text><text x="424.0" y="248.8" font-size="13" fill="#a63f16" font-weight="400" text-anchor="middle">입력 오류 400  /  STORE_FULL</text></svg>