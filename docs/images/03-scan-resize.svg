<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="순회 중 테이블이 줄어들 때: 일반 순서는 놓치고 비트 뒤집기 순서는 안전하다"><title>순회 중 테이블이 줄어들 때: 일반 순서는 놓치고 비트 뒤집기 순서는 안전하다</title><desc>8칸을 4칸으로 줄이면 j번과 j+4번 칸이 합쳐진다. 일반 순서는 4~7번 키를 놓치지만 비트 뒤집기 순서는 놓치지 않는다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="538" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start">순회 도중 테이블이 8칸 → 4칸으로 줄어들면?</text><rect x="560" y="28" width="18" height="18" rx="4" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="585" y="43" font-size="14" fill="#52514e" font-weight="600" text-anchor="start">이미 돈 칸</text><rect x="671" y="28" width="18" height="18" rx="4" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="696" y="43" font-size="14" fill="#52514e" font-weight="600" text-anchor="start">아직 안 돈 칸</text><rect x="801" y="28" width="18" height="18" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><text x="826" y="43" font-size="14" fill="#52514e" font-weight="600" text-anchor="start">놓친 키</text><rect x="24" y="72" width="444" height="450" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2.2"/><text x="44" y="106" font-size="20" fill="#a63f16" font-weight="700" text-anchor="start">✗ 일반 순서   0 → 1 → 2 → 3 …</text><text x="44" y="130" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">0~3번 칸을 돌고 난 뒤 줄어들면 (다음은 4번 칸)</text><text x="44" y="164" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">줄어들기 전 (8칸)  ·  아래 숫자 = 돈 순서</text><rect x="41" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="64" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">0</text><text x="64" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">1</text><rect x="93" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="116" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="116" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">2</text><rect x="145" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="168" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="168" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">3</text><rect x="197" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="220" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="220" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">4</text><rect x="249" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="272" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">4</text><rect x="301" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="324" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">5</text><rect x="353" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="376" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">6</text><rect x="405" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="428" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">7</text><line x1="58" y1="254" x2="58" y2="292" stroke="#52514e" stroke-width="2.2" marker-end="url(#ah-ink)"/><text x="74" y="279" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">4칸으로 줄어듦 — j번과 j+4번이 한 칸으로 합쳐짐</text><text x="44" y="320" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">줄어든 뒤 (4칸)  ·  칸 안의 숫자 = 합쳐진 옛 칸 번호</text><rect x="36" y="330" width="96" height="76" rx="9" fill="#fdeae1" stroke="#eb6834" stroke-width="2"/><text x="84" y="349" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle">0번 칸</text><rect x="42" y="358" width="40" height="36" rx="6" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="62" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">0</text><rect x="86" y="358" width="40" height="36" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><text x="106" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="84" y="430" font-size="14" fill="#a63f16" font-weight="700" text-anchor="middle">✗ 놓침</text><rect x="144" y="330" width="96" height="76" rx="9" fill="#fdeae1" stroke="#eb6834" stroke-width="2"/><text x="192" y="349" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle">1번 칸</text><rect x="150" y="358" width="40" height="36" rx="6" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="170" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="194" y="358" width="40" height="36" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><text x="214" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="192" y="430" font-size="14" fill="#a63f16" font-weight="700" text-anchor="middle">✗ 놓침</text><rect x="252" y="330" width="96" height="76" rx="9" fill="#fdeae1" stroke="#eb6834" stroke-width="2"/><text x="300" y="349" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle">2번 칸</text><rect x="258" y="358" width="40" height="36" rx="6" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="278" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="302" y="358" width="40" height="36" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><text x="322" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="300" y="430" font-size="14" fill="#a63f16" font-weight="700" text-anchor="middle">✗ 놓침</text><rect x="360" y="330" width="96" height="76" rx="9" fill="#fdeae1" stroke="#eb6834" stroke-width="2"/><text x="408" y="349" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle">3번 칸</text><rect x="366" y="358" width="40" height="36" rx="6" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="386" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="410" y="358" width="40" height="36" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><text x="430" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="408" y="430" font-size="14" fill="#a63f16" font-weight="700" text-anchor="middle">✗ 놓침</text><text x="44" y="482" font-size="16" fill="#a63f16" font-weight="700" text-anchor="start">다음 칸인 4번이 4칸 테이블에 없어 순회가 끝난다</text><text x="44" y="506" font-size="16" fill="#a63f16" font-weight="700" text-anchor="start">→ 합쳐진 4~7번의 키를 한 번도 못 본다</text><rect x="492" y="72" width="444" height="450" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2.2"/><text x="512" y="106" font-size="20" fill="#184f95" font-weight="700" text-anchor="start">✓ 비트 뒤집기   0 → 4 → 2 → 6 …</text><text x="512" y="130" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">0, 4, 2, 6번 칸을 돌고 난 뒤 줄어들면 (다음은 1번 칸)</text><text x="512" y="164" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">줄어들기 전 (8칸)  ·  아래 숫자 = 돈 순서</text><rect x="509" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="532" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">0</text><text x="532" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">1</text><rect x="561" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="584" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">1</text><rect x="613" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="636" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="636" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">3</text><rect x="665" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="688" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">3</text><rect x="717" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="740" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="740" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">2</text><rect x="769" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="792" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">5</text><rect x="821" y="174" width="46" height="48" rx="7" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="844" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="844" y="242" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle">4</text><rect x="873" y="174" width="46" height="48" rx="7" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="896" y="206" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle">7</text><line x1="526" y1="254" x2="526" y2="292" stroke="#52514e" stroke-width="2.2" marker-end="url(#ah-ink)"/><text x="542" y="279" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">4칸으로 줄어듦 — j번과 j+4번이 한 칸으로 합쳐짐</text><text x="512" y="320" font-size="13" fill="#52514e" font-weight="700" text-anchor="start">줄어든 뒤 (4칸)  ·  칸 안의 숫자 = 합쳐진 옛 칸 번호</text><rect x="504" y="330" width="96" height="76" rx="9" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="552" y="349" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle">0번 칸</text><rect x="510" y="358" width="40" height="36" rx="6" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="530" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">0</text><rect x="554" y="358" width="40" height="36" rx="6" fill="#52514e" stroke="#52514e" stroke-width="1.5"/><text x="574" y="383" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="552" y="430" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">✓ 다 봄</text><rect x="612" y="330" width="96" height="76" rx="9" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="660" y="349" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle">1번 칸</text><rect x="618" y="358" width="40" height="36" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="638" y="383" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle">1</text><rect x="662" y="358" width="40" height="36" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="682" y="383" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle">5</text><text x="660" y="430" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="middle"