<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="이체 도중에 읽으면 무엇이 보일까"><title>이체 도중에 읽으면 무엇이 보일까</title><desc>트랜잭션 없이 요청 두 개로 나누면 중간 상태(a 990, b 0, 합계 990)가 보이고, 트랜잭션은 중간 상태 없이 합계가 항상 1000이다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="538" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="40" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start">이체 도중에 읽으면 무엇이 보일까?</text><text x="28" y="66" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">a에서 10을 빼서 b에 더하는 이체. 처음 a = 1000, b = 0 이라 합계는 항상 1000이어야 한다.</text><text x="28" y="148" font-size="21" fill="#a63f16" font-weight="700" text-anchor="start">트랜잭션 없음</text><text x="28" y="174" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">요청 2개로 나눔</text><rect x="214" y="106" width="170" height="104" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="236" y="141" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">a</text><text x="266" y="141" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">1000</text><text x="236" y="172" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">b</text><text x="266" y="172" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">0</text><line x1="228" y1="182" x2="370" y2="182" stroke="#c3c2b7" stroke-width="1.2"/><text x="299" y="202" font-size="15" fill="#184f95" font-weight="700" text-anchor="middle">합계 1000 ✓</text><rect x="484" y="106" width="170" height="104" rx="12" fill="#fdeae1" stroke="#eb6834" stroke-width="2.6"/><text x="506" y="141" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">a</text><text x="536" y="141" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">990</text><text x="506" y="172" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">b</text><text x="536" y="172" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">0</text><line x1="498" y1="182" x2="640" y2="182" stroke="#eb6834" stroke-width="1.2"/><text x="569" y="202" font-size="15" fill="#a63f16" font-weight="700" text-anchor="middle">합계 990 ✗</text><rect x="754" y="106" width="170" height="104" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="776" y="141" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">a</text><text x="806" y="141" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">990</text><text x="776" y="172" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">b</text><text x="806" y="172" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">10</text><line x1="768" y1="182" x2="910" y2="182" stroke="#c3c2b7" stroke-width="1.2"/><text x="839" y="202" font-size="15" fill="#184f95" font-weight="700" text-anchor="middle">합계 1000 ✓</text><line x1="388" y1="158" x2="480" y2="158" stroke="#52514e" stroke-width="2.4" marker-end="url(#ah-ink)"/><text x="434" y="144" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">① a −10</text><line x1="658" y1="158" x2="750" y2="158" stroke="#52514e" stroke-width="2.4" marker-end="url(#ah-ink)"/><text x="704" y="144" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">② b +10</text><line x1="569" y1="212" x2="569" y2="230" stroke="#eb6834" stroke-width="2.6"/><rect x="449" y="230" width="240" height="52" rx="10" fill="#fdeae1" stroke="#eb6834" stroke-width="2"/><text x="569.0" y="250.1" font-size="15" fill="#a63f16" font-weight="700" text-anchor="middle">다른 요청이 끼어들어 읽음</text><text x="569.0" y="272.1" font-size="16" fill="#a63f16" font-weight="700" text-anchor="middle">→ 합계 990 ✗  (틀린 값)</text><line x1="28" y1="298" x2="932" y2="298" stroke="#e1e0d9" stroke-width="1.5"/><text x="28" y="374" font-size="21" fill="#184f95" font-weight="700" text-anchor="start">트랜잭션</text><text x="28" y="400" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">요청 1개로 묶음</text><rect x="214" y="332" width="170" height="104" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="236" y="367" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">a</text><text x="266" y="367" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">1000</text><text x="236" y="398" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">b</text><text x="266" y="398" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">0</text><line x1="228" y1="408" x2="370" y2="408" stroke="#c3c2b7" stroke-width="1.2"/><text x="299" y="428" font-size="15" fill="#184f95" font-weight="700" text-anchor="middle">합계 1000 ✓</text><rect x="754" y="332" width="170" height="104" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="776" y="367" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">a</text><text x="806" y="367" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">990</text><text x="776" y="398" font-size="15" fill="#52514e" font-weight="600" text-anchor="start">b</text><text x="806" y="398" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">10</text><line x1="768" y1="408" x2="910" y2="408" stroke="#c3c2b7" stroke-width="1.2"/><text x="839" y="428" font-size="15" fill="#184f95" font-weight="700" text-anchor="middle">합계 1000 ✓</text><rect x="449" y="316" width="240" height="136" rx="12" fill="#e3effc" stroke="#2a78d6" stroke-width="2.6" stroke-dasharray="6 4"/><rect x="461" y="340" width="96" height="44" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="509.0" y="368.3" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="middle">a −10</text><line x1="559" y1="362" x2="579" y2="362" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ah-blue)"/><rect x="581" y="340" width="96" height="44" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="629.0" y="368.3" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="middle">b +10</text><text x="569" y="414" font-size="16" fill="#184f95" font-weight="700" text-anchor="middle">한 덩어리로 실행</text><text x="569" y="438" font-size="14" fill="#184f95" font-weight="400" text-anchor="middle">(중간 상태 카드가 없다)</text><line x1="388" y1="384" x2="447" y2="384" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ah-blue)"/><line x1="691" y1="384" x2="750" y2="384" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ah-blue)"/><text x="569" y="482" font-size="18" fill="#184f95" font-weight="700" text-anchor="middle">끼어들 수 없으니, 언제 읽어도 합계는 1000 ✓</text></svg>