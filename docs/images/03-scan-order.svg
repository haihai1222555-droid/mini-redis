<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="커서가 버킷을 도는 순서"><title>커서가 버킷을 도는 순서</title><desc>16칸 해시 테이블에서 일반 커서는 0,1,2 순서, 역순 이진 커서는 0,8,4,12,2,10 순서로 방문한다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="370" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">커서가 16개 칸을 도는 순서: 일반 vs 역순 이진</text><text x="28" y="68" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">박스 안 = 칸 번호 · 아래 숫자 = 방문 순서 · 색이 진할수록 나중에 방문</text><text x="20" y="102" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">일반 커서  0 → 1 → 2 → 3 …</text><rect x="20" y="116" width="50" height="44" rx="6" fill="#86b6ef" stroke="none" stroke-width="0"/><text x="45" y="145" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="middle">0</text><text x="45" y="180" font-size="14" fill="#52514e" font-weight="600" text-anchor="middle">1</text><rect x="78" y="116" width="50" height="44" rx="6" fill="#86b6ef" stroke="none" stroke-width="0"/><text x="103" y="145" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="middle">1</text><text x="103" y="180" font-size="14" fill="#52514e" font-weight="600" text-anchor="middle">2</text><rect x="136" y="116" width="50" height="44" rx="6" fill="#