<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="트랜잭션이 실행되는 순서"><title>트랜잭션이 실행되는 순서</title><desc>사전 검증에서 형식 오류가 하나라도 있으면 아무것도 실행하지 않고, 통과하면 연속 실행하며, 실행 중 오류는 롤백 없이 그 명령만 실패한다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="448" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">트랜잭션이 실행되는 순서</text><rect x="24" y="68" width="150" height="78" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="2"/><text x="99.0" y="103.8" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">명령 묶음</text><text x="99.0" y="123.5" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">최대 1,000개</text><rect x="214" y="68" width="190" height="78" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="309.0" y="103.8" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">① 사전 검증</text><text x="309.0" y="123.5" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">형식만 먼저 검사</text><rect x="444" y="68" width="220" height="78" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2.5"/><text x="554.0" y="103.8" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">② 연속 실행</text><text x="554.0" y="123.5" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">끼어들기 없음</text><rect x="704" y="68" width="220" height="78" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="814.0" y="103.8" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">③ AOF 에 한 줄 기록</text><text x="814.0" y="123.5" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">변경이 있을 때만</text><line x1="176" y1="107.0" x2="212" y2="107.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah-ink)"/><line x1="406" y1="107.0" x2="442" y2="107.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah-ink)"/><line x1="666" y1="107.0" x2="702" y2="107.0" stroke="#52514e" stroke-width="2" marker-end="url(#ah-ink)"/><text x="424" y="98.0" font-size="13" fill="#184f95" font-weight="700" text-anchor="middle">통과</text><line x1="309" y1="146" x2="309" y2="218" stroke="#eb6834" stroke-width="2.2" marker-end="url(#ah-orange)"/><line x1="554" y1="146" x2="554" y2="218" stroke="#52514e" stroke-width="2.2" marker-end="url(#ah-ink)"/><line x1="814" y1="146" x2="814" y2="218" stroke="#52514e" stroke-width="2.2" marker-end="url(#ah-ink)"/><rect x="174" y="220" width="260" height="130" rx="10" fill="#fdeae1" stroke="#eb6834" stroke-width="2"/><text x="304.0" y="260.9" font-size="15" fill="#a63f16" font-weight="700" text-anchor="middle">✗ 형식 오류가 하나라도 있으면</text><text x="304.0" y="281.9" font-size="15" fill="#a63f16" font-weight="700" text-anchor="middle">아무것도 실행하지 않고</text><text x="304.0" y="302.9" font-size="15" fill="#a63f16" font-weight="700" text-anchor="middle">400 으로 거부</text><text x="304.0" y="320.7" font-size="12" fill="#a63f16" font-weight="400" text-anchor="middle">예: 모르는 cmd · 잘못된 key · ttl ≤ 0</text><rect x="454" y="220" width="220" height="130" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="2"/><text x="564.0" y="260.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">실행 중 오류는 롤백 없음</text><text x="564.0" y="281.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">그 명령만 실패하고</text><text x="564.0" y="302.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">나머지는 계속 실행</text><text x="564.0" y="320.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">예: 문자열에 incr</text><rect x="704" y="220" width="220" height="130" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2"/><text x="814.0" y="260.5" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">{ "o": "t", "r": […] }</text><text x="814.0" y="280.1" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">한 줄로 기록 →</text><text x="814.0" y="299.7" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">크래시가 나도 통째로 복구</text><text x="814.0" y="319.3" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">하거나 통째로 버려진다</text><text x="28" y="388" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">※ 형식 오류는 '실행 전에' 알 수 있어서 전부 거부하고, 실행해 봐야 아는 오류는 그 명령만 실패시킨다 (Redis MULTI/EXEC 와 같은 모델).</text><text x="28" y="412" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">※ HTTP 응답은 일부 명령이 실패해도 200 이고, 실패는 results[i].ok 로 구분한다.</text></svg>