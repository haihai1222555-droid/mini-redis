<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="공통 원리: 동기 실행은 끼어들 수 없다"><title>공통 원리: 동기 실행은 끼어들 수 없다</title><desc>동시에 도착한 요청들이 단일 스레드 이벤트 루프에서 한 번에 하나씩, 끝까지 실행된다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="438" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">세 기능의 공통 원리: 동기 실행 = 끼어들기 없음</text><text x="24" y="84" font-size="14" fill="#52514e" font-weight="600" text-anchor="start">동시에 도착한 요청</text><rect x="24" y="98" width="150" height="48" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="99.0" y="127.6" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="middle">요청 A</text><line x1="176" y1="122" x2="242" y2="176" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><rect x="24" y="164" width="150" height="48" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="99.0" y="193.6" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="middle">요청 B</text><line x1="176" y1="188" x2="242" y2="200" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><rect x="24" y="230" width="150" height="48" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="99.0" y="259.6" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="middle">요청 C</text><line x1="176" y1="254" x2="242" y2="224" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><rect x="244" y="90" width="692" height="232" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="264" y="120" font-size="16" fill="#184f95" font-weight="700" text-anchor="start">이벤트 루프 (단일 스레드) — 한 번에 하나씩, 끝까지</text><rect x="264" y="150" width="154" height="92" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2"/><text x="341.0" y="192.2" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">LRU</text><text x="341.0" y="212.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">갱신 + 축출</text><rect x="430" y="150" width="154" height="92" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2"/><text x="507.0" y="192.2" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">mset</text><text x="507.0" y="212.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">항목 전체</text><rect x="596" y="150" width="154" height="92" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2"/><text x="673.0" y="192.2" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">트랜잭션</text><text x="673.0" y="212.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">명령 전체</text><rect x="762" y="150" width="154" height="92" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2"/><text x="839.0" y="192.2" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="middle">SCAN</text><text x="839.0" y="212.8" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">한 페이지</text><line x1="264" y1="270" x2="912" y2="270" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><text x="912" y="296" font-size="13" fill="#52514e" font-weight="600" text-anchor="end">시간 →</text><text x="264" y="296" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">각 블록은 쪼갤 수 없는 한 덩어리</text><rect x="24" y="346" width="912" height="70" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="2"/><text x="480.0" y="375.4" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="middle">그래서 락이 없다: 블록 안에서는 다른 요청이 끼어들 수 없으므로,</text><text x="480.0" y="397.8" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="middle">읽고 → 계산하고 → 쓰는 작업도, 여러 키에 걸친 작업도 한 덩어리로 안전하다.</text></svg>