<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="읽기 300번 중 합계가 틀리게 보인 횟수"><title>읽기 300번 중 합계가 틀리게 보인 횟수</title><desc>요청 2개로 나누면 160번, 트랜잭션은 0번</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="298" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">읽기 300번 중 합계가 틀리게 보인 횟수</text><line x1="250.0" y1="70" x2="250.0" y2="214" stroke="#c3c2b7" stroke-width="1.5"/><text x="250.0" y="236" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">0</text><line x1="460.0" y1="70" x2="460.0" y2="214" stroke="#e1e0d9" stroke-width="1.5"/><text x="460.0" y="236" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">100</text><line x1="670.0" y1="70" x2="670.0" y2="214" stroke="#e1e0d9" stroke-width="1.5"/><text x="670.0" y="236" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">200</text><line x1="880.0" y1="70" x2="880.0" y2="214" stroke="#e1e0d9" stroke-width="1.5"/><text x="880.0" y="236" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">300</text><text x="28" y="112" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">요청 2개로 나눔</text><text x="28" y="134" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">(트랜잭션 없음)</text><path d="M250,90 h332.0 a4,4 0 0 1 4,4 v36 a4,4 0 0 1 -4,4 h-332.0 z" fill="#eb6834"/><text x="596.0" y="120" font-size="17" fill="#a63f16" font-weight="700" text-anchor="start">160번  (53%)</text><text x="28" y="186" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">트랜잭션</text><text x="28" y="208" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">(요청 1개)</text><rect x="250" y="156" width="4" height="44" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/><text x="264" y="186" font-size="17" fill="#184f95" font-weight="700" text-anchor="start">0번  ✓</text><text x="28" y="276" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">※ 같은 PC에서 측정한 값. 실행할 때마다 조금씩 다르다.</text></svg>