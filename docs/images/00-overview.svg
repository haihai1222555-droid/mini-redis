<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="추가한 기능 4가지"><title>추가한 기능 4가지</title><desc>LRU 축출, 배치, SCAN, 트랜잭션 네 가지 기능 소개</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="328" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">이번에 추가한 기능 4가지</text><rect x="24" y="66" width="216" height="240" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="54" cy="100" r="15" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="54" y="105.76" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="80" y="107" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">LRU 축출</text><text x="44" y="150" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">가득 차면 가장 오래</text><text x="44" y="173" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">안 쓴 키부터 버린다</text><rect x="256" y="66" width="216" height="240" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="286" cy="100" r="15" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="286" y="105.76" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="312" y="107" font-size="21" fill="#0b0b0b" font-weight